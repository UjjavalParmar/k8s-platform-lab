name: terraform
on:
  pull_request:
    paths: ["terraform/envs/**"]
  push:
    branches: [main]
    paths: ["terraform/envs/**"]
permissions:
  contents: read
  pull-requests: write
env:
  TF_DIR: terraform/envs/dev
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: ap-south-1
jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      ministack:
        image: ministackorg/ministack:1.5.27
        ports: ["4566:4566"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      - name: wait for MiniStack, create state bucket
        run: |
          until curl -sf localhost:4566/_ministack/health; do sleep 2; done
          aws --endpoint-url http://localhost:4566 s3 mb s3://tfstate
      - run: terraform -chdir=$TF_DIR init -input=false
      - run: terraform -chdir=$TF_DIR fmt -check -recursive
      - run: terraform -chdir=$TF_DIR validate
      - name: plan
        shell: bash
        run: terraform -chdir=$TF_DIR plan -input=false -no-color | tee plan.txt
      - name: comment plan on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; tail -c 60000 plan.txt; echo '```'; } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
  apply-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: prod
    services:
      ministack:
        image: ministackorg/ministack:1.5.27
        ports: ["4566:4566"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      - run: |
          until curl -sf localhost:4566/_ministack/health; do sleep 2; done
          aws --endpoint-url http://localhost:4566 s3 mb s3://tfstate
      - run: terraform -chdir=$TF_DIR init -input=false
      - run: terraform -chdir=$TF_DIR apply -input=false -auto-approve
      - name: idempotency (exit 0 = no changes)
        run: terraform -chdir=$TF_DIR plan -input=false -detailed-exitcode
      - run: terraform -chdir=$TF_DIR destroy -input=false -auto-approve
